[project]
name = "precision-pulse-backend"
version = "1.0.0"
description = "PrecisionPulse Backend API"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.7",
    "Flask-CORS==4.0.0",
    "Flask-SocketIO==5.3.5",
    "Flask-Limiter==3.5.0",
    "Flask-Session==0.8.0",
    "python-socketio==5.10.0",
    "python-engineio==4.8.0",
    "PyJWT==2.8.0",
    "python-dotenv==1.0.0",
    "psycopg2-binary==2.9.9",
    "bcrypt==4.1.1",
    "marshmallow==3.20.1",
    "gmqtt==0.6.16",
    "websockets==12.0",
    "paho-mqtt==1.6.1",
    "reportlab==4.2.5",
    "openpyxl>=3.1.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
