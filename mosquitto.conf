port 1883
listener 18883
protocol mqtt
cafile /home/saniyachavani/Documents/PrecisionpulseDocs/dspl-precision-pulse-backend/config/ca.crt
certfile /home/saniyachavani/Documents/PrecisionpulseDocs/dspl-precision-pulse-backend/config/server.crt
keyfile /home/saniyachavani/Documents/PrecisionpulseDocs/dspl-precision-pulse-backend/config/server.key
tls_version tlsv1.2

allow_anonymous true
max_connections -1
max_queued_messages 1000
message_size_limit 0
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
