[project]
name = "precision-pulse-desktop"
version = "1.0.0"
description = "PrecisionPulse Desktop Client"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "paho-mqtt>=1.6.1",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.1",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "python-socketio[client]>=5.10.0",
    "python-engineio[client]>=4.8.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
